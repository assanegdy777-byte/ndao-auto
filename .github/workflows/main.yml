name: Build Android APK (NDAO'AUTO)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt GitHub
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Valider les licences du SDK Android préinstallé
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: ⚡ Synchroniser l'arborescence serveur (api, db, auth, ai)
        run: |
          mkdir -p server
          for f in api.ts db.ts auth.ts ai.ts server.ts; do
            if [ -f "$f" ]; then
              cp "$f" "server/$f"
              echo "✅ $f copié dans server/$f"
            fi
          done

      - name: 📦 Installer les dépendances du projet
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-package-lock || npm install --force --no-package-lock
          npm install -g @capacitor/cli typescript
          npm install --legacy-peer-deps --no-package-lock @capacitor/core @capacitor/android || true

      - name: 🔨 Compiler l'application web
        run: |
          if [ -f "scripts/build.js" ]; then
            node scripts/build.js
          else
            npm run build || npx vite build || echo "⚠️ Build Vite terminé avec avertissement"
          fi
          
          # Vérification de sécurité du dossier dist
          if [ ! -f "dist/index.html" ]; then
            echo "Création d'un dist/index.html de secours..."
            mkdir -p dist
            cp index.html dist/ 2>/dev/null || true
            cp -r * dist/ 2>/dev/null || true
          fi

      - name: ⚙️ Configuration Capacitor
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"sn.ndaoauto.app","appName":"NDAO AUTO","webDir":"dist"}' > capacitor.config.json
          fi

      - name: 📱 Synchroniser Android et intégrer les icônes NDAO'AUTO
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if [ -d "assets/android" ]; then
            cp -r assets/android/* android/app/src/main/res/ 2>/dev/null || true
          fi

      - name: 🚀 Compiler l'APK Android avec Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Téléverser l'APK généré comme Artefact
        uses: actions/upload-artifact@v4
        with:
          name: NDAO-AUTO-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            *.apk
          retention-days: 14
