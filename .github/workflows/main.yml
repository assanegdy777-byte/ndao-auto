name: Fabrication APK NDAO AUTO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilation et Création APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Valider les licences du SDK Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 📦 Installer les outils de packaging mobile
        run: |
          rm -f package-lock.json
          npm install -g typescript @capacitor/cli
          npm install --legacy-peer-deps --no-package-lock @capacitor/core @capacitor/android

      - name: ⚡ Vérifier et compiler le projet
        run: |
          # 1. Détection automatique si les fichiers sont dans un sous-dossier
          if [ ! -f "package.json" ]; then
            for dir in */; do
              if [ -f "${dir}package.json" ]; then
                echo "📁 Fichiers détectés dans le sous-dossier : $dir"
                cp -rn "$dir"* . 2>/dev/null || true
                break
              fi
            done
          fi

          # 2. Configuration Capacitor automatique
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"sn.ndaoauto.app","appName":"NDAO AUTO","webDir":"dist"}' > capacitor.config.json
          fi

          # 3. Compilation ou utilisation du dossier dist
          if [ -f "scripts/build.js" ]; then
            node scripts/build.js
          elif [ -f "dist/index.html" ]; then
            echo "✅ Dossier dist/ déjà présent et prêt."
          else
            echo "❌ Erreur : Fichiers du projet introuvables."
            echo "Voici les fichiers actuellement présents sur votre dépôt :"
            ls -la
            exit 1
          fi

      - name: 📱 Initialiser et synchroniser le projet Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if [ -d "assets/android" ]; then
            cp -r assets/android/* android/app/src/main/res/ 2>/dev/null || true
          fi

      - name: 🔨 Fabriquer le fichier APK avec Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Mettre à disposition l'APK à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: NDAO-AUTO-Application-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
