name: Build Android APK (NDAO'AUTO)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt GitHub
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Valider les licences du SDK Android préinstallé
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 📦 Préparer l'environnement npm et Capacitor
        run: |
          rm -f package-lock.json
          npm install -g typescript @capacitor/cli
          npm install --legacy-peer-deps --no-package-lock @capacitor/core @capacitor/android || true

      - name: ⚡ Correction automatique des chemins Vite si nécessaire
        run: |
          # Si vite.config.ts cherche ./server/api.ts alors que api.ts est à la racine
          if [ -f "vite.config.ts" ] && [ -f "api.ts" ] && [ ! -f "server/api.ts" ]; then
            mkdir -p server
            cp api.ts server/api.ts
            echo "✅ Chemins Vite normalisés (server/api.ts synchronisé)."
          fi

      - name: 🔨 Compiler le projet web (HTML/JS/Assets)
        run: |
          if [ -f "scripts/build.js" ]; then
            node scripts/build.js
          elif [ -f "vite.config.ts" ]; then
            npm run build || npx vite build
          elif [ -f "dist/index.html" ]; then
            echo "✅ Dossier dist/ déjà prêt."
          else
            mkdir -p dist
            cp -r * dist/ 2>/dev/null || true
          fi

      - name: ⚙️ Configuration Capacitor
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"sn.ndaoauto.app","appName":"NDAO AUTO","webDir":"dist"}' > capacitor.config.json
          fi

      - name: 📱 Synchroniser Android et intégrer les icônes NDAO'AUTO
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if [ -d "assets/android" ]; then
            cp -r assets/android/* android/app/src/main/res/ 2>/dev/null || true
          fi

      - name: 🚀 Compiler l'APK Android avec Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Téléverser l'APK généré comme Artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NDAO-AUTO-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
