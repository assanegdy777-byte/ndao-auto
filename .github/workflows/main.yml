name: Fabrication APK NDAO AUTO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilation et Création APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Valider les licences du SDK Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 📦 Installer les outils de packaging mobile
        run: |
          npm install --save-dev typescript
          npm install --save @capacitor/core @capacitor/cli @capacitor/android

      - name: ⚡ Compiler le projet web
        run: |
          node scripts/build.js

      - name: 📱 Générer le projet natif Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if [ -d "assets/android" ]; then
            cp -r assets/android/* android/app/src/main/res/ 2>/dev/null || true
          fi

      - name: 🔨 Fabriquer le fichier APK avec Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Mettre à disposition l'APK à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: NDAO-AUTO-Application-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
