name: Fabrication APK NDAO AUTO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilation et Création APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🟢 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Valider les licences du SDK Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 📦 Installer les dépendances du projet
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install -g @capacitor/cli
          npm install --legacy-peer-deps @capacitor/core @capacitor/android

      - name: ⚡ Compiler l'application React avec Vite
        run: |
          npm run build || npx vite build

      - name: 📱 Générer et synchroniser le projet Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🔨 Fabriquer le fichier APK avec Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Mettre à disposition l'APK à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: NDAO-AUTO-Application-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            ndao-auto.apk
            NDAO_AUTO.apk
          retention-days: 14
